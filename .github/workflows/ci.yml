name: CI - Tech Challenge

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:123456@localhost:5432/blog
      PORT: 3000

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Instalar dependências do backend
        run: |
          npm ci --include=dev
          npm install -g tsx

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Sincronizar estrutura do banco de dados
        run: npx prisma db push --accept-data-loss

      - name: Executar testes do backend
        run: npm test

      # Frontend
      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: npm ci

      - name: Executar ESLint do frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Gerar build do frontend
        working-directory: ./frontend
        run: npm run build