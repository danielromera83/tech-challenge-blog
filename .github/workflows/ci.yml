name: CI - Tech Challenge

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:123456@localhost:5432/blog
      PORT: 3000
      JWT_SECRET: segredo-exclusivo-do-ambiente-de-ci

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Instalar dependências do backend
        run: |
          npm ci --include=dev
          npm install -g tsx

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Executar testes do backend
        run: npm test

      # Frontend
      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: npm ci

      - name: Executar ESLint do frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Gerar build do frontend
        working-directory: ./frontend
        run: npm run build